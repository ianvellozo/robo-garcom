# Cardapio do restaurante, carregado em /garcom pelo sim.launch.
# Todos os nos leem daqui: as telas (o que mostrar), o estoque (quanto tem)
# e a missao (em qual estacao pegar cada item).
#
#   item:    codigo usado nas mensagens (sem acento e sem espaco)
#   nome:    como aparece nas telas
#   icone:   figura mostrada na tela da mesa
#   preco:   em reais
#   estacao: ponto do pontos.yaml onde o robo pega o item
#   estoque: quantidade inicial
cardapio:
  - {item: cafe,      nome: "Café",      icone: "☕", preco: 6.00,  estacao: estacao_cafe,      estoque: 10}
  - {item: suco,      nome: "Suco",      icone: "🧃", preco: 8.50,  estacao: estacao_cafe,      estoque: 6}
  - {item: croissant, nome: "Croissant", icone: "🥐", preco: 9.00,  estacao: estacao_croissant, estoque: 5}
  - {item: rosquinha, nome: "Rosquinha", icone: "🍩", preco: 7.50,  estacao: estacao_croissant, estoque: 0}

# Nome de cada estacao nas telas
estacoes:
  estacao_cafe: "Bancada de bebidas"
  estacao_croissant: "Bancada da padaria"

# Avisa quando um item chega nesta quantidade ou menos
estoque_baixo: 2
